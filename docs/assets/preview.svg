<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Segoe UI',-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eafaf0"/>
      <stop offset="1" stop-color="#f8fff9"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16a86b"/>
      <stop offset="1" stop-color="#087849"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#157e4d" flood-opacity="0.16"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#157e4d" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="720" fill="url(#bg)"/>

  <!-- window frame -->
  <g filter="url(#card)">
    <rect x="48" y="40" width="1104" height="640" rx="22" fill="#ffffff"/>
  </g>

  <!-- title bar -->
  <circle cx="82" cy="76" r="7" fill="#ff6b3d"/>
  <circle cx="106" cy="76" r="7" fill="#ffcf5c"/>
  <circle cx="130" cy="76" r="7" fill="#16a86b"/>
  <rect x="470" y="66" width="260" height="22" rx="11" fill="#eef6f1"/>
  <text x="600" y="82" text-anchor="middle" fill="#759083" font-size="13">planflow.local</text>

  <!-- divider under titlebar -->
  <line x1="48" y1="104" x2="1152" y2="104" stroke="#e4f2e9" stroke-width="1.5"/>

  <!-- ===== Sidebar ===== -->
  <rect x="48" y="104" width="300" height="576" fill="#f4fbf7"/>
  <line x1="348" y1="104" x2="348" y2="680" stroke="#e4f2e9" stroke-width="1.5"/>

  <!-- brand -->
  <rect x="76" y="132" width="40" height="40" rx="11" fill="url(#brand)"/>
  <path d="M88 152 l6 6 12 -14" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="128" y="150" fill="#163a29" font-size="19" font-weight="700">PlanFlow</text>
  <text x="128" y="168" fill="#759083" font-size="12">Markdown 任务队列</text>

  <!-- search -->
  <rect x="76" y="192" width="244" height="38" rx="10" fill="#ffffff" stroke="#d4ecdd"/>
  <circle cx="98" cy="211" r="6" fill="none" stroke="#8aa89a" stroke-width="1.6"/>
  <line x1="103" y1="216" x2="108" y2="221" stroke="#8aa89a" stroke-width="1.6" stroke-linecap="round"/>
  <text x="118" y="216" fill="#a5bcb0" font-size="13">搜索队列…</text>

  <text x="76" y="262" fill="#8aa89a" font-size="11" letter-spacing="1.5">我的队列 · 4</text>

  <!-- queue item: active -->
  <g filter="url(#soft)">
    <rect x="76" y="276" width="244" height="58" rx="12" fill="#ffffff" stroke="#16a86b" stroke-width="1.6"/>
  </g>
  <rect x="88" y="290" width="30" height="30" rx="9" fill="#dcf8e8"/>
  <path d="M96 305 h14 M96 300 h14 M96 310 h9" stroke="#087849" stroke-width="1.8" stroke-linecap="round"/>
  <text x="128" y="302" fill="#163a29" font-size="14" font-weight="600">周四计划</text>
  <text x="128" y="320" fill="#759083" font-size="11">学习 · 8 项任务</text>

  <!-- queue item -->
  <rect x="76" y="344" width="244" height="52" rx="12" fill="#ffffff" stroke="#eaf4ee"/>
  <rect x="88" y="356" width="30" height="28" rx="9" fill="#fff0df"/>
  <text x="128" y="367" fill="#163a29" font-size="14" font-weight="600">TS 恢复课 H001–H024</text>
  <text x="128" y="384" fill="#759083" font-size="11">学习 · 24 小时任务</text>

  <!-- queue item -->
  <rect x="76" y="406" width="244" height="52" rx="12" fill="#ffffff" stroke="#eaf4ee"/>
  <rect x="88" y="418" width="30" height="28" rx="9" fill="#e7f0ff"/>
  <text x="128" y="429" fill="#163a29" font-size="14" font-weight="600">本周工作</text>
  <text x="128" y="446" fill="#759083" font-size="11">工作 · 12 项任务</text>

  <!-- queue item -->
  <rect x="76" y="468" width="244" height="52" rx="12" fill="#ffffff" stroke="#eaf4ee"/>
  <rect x="88" y="480" width="30" height="28" rx="9" fill="#ffe9e9"/>
  <text x="128" y="491" fill="#163a29" font-size="14" font-weight="600">健身计划</text>
  <text x="128" y="508" fill="#759083" font-size="11">运动 · 5 项任务</text>

  <!-- upload dropzone -->
  <rect x="76" y="600" width="244" height="56" rx="12" fill="#f0faf4" stroke="#bfe0cc" stroke-dasharray="6 5"/>
  <path d="M188 622 v-11 m-6 6 l6 -6 l6 6" stroke="#16a86b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="198" y="644" text-anchor="middle" fill="#587567" font-size="12">拖入 .md / .txt 导入</text>

  <!-- ===== Main area ===== -->
  <!-- energy banner -->
  <g filter="url(#soft)">
    <rect x="380" y="132" width="740" height="96" rx="16" fill="url(#brand)"/>
  </g>
  <text x="404" y="170" fill="#d9fbe9" font-size="12" letter-spacing="1">H005 · 当前小时</text>
  <text x="404" y="198" fill="#ffffff" font-size="18" font-weight="600">把眼前这一小时做到极致，成长自然会给你答案。</text>
  <circle cx="1064" cy="180" r="30" fill="#ffffff" fill-opacity="0.14"/>
  <path d="M1064 164 l4 12 l12 2 l-9 8 l3 12 l-10 -7 l-10 7 l3 -12 l-9 -8 l12 -2 z" fill="#ffffff" fill-opacity="0.9"/>

  <!-- toolbar -->
  <text x="380" y="264" fill="#163a29" font-size="20" font-weight="700">周四计划</text>
  <rect x="380" y="278" width="52" height="20" rx="10" fill="#dcf8e8"/>
  <text x="406" y="292" text-anchor="middle" fill="#087849" font-size="11" font-weight="600">学习</text>

  <!-- buttons -->
  <rect x="866" y="252" width="112" height="38" rx="10" fill="#ffffff" stroke="#d4ecdd"/>
  <path d="M886 265 h7 l4 4 v14 h-11 z" fill="none" stroke="#16a86b" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="912" y="276" fill="#163a29" font-size="13">预览原文</text>

  <rect x="990" y="252" width="130" height="38" rx="10" fill="url(#brand)"/>
  <path d="M1010 271 v-9 m-4 5 l4 4 l4 -4 M1005 276 h10" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="1034" y="276" fill="#ffffff" font-size="13" font-weight="600">导出进度</text>

  <!-- filter chips -->
  <rect x="380" y="312" width="60" height="30" rx="15" fill="#16a86b"/>
  <text x="410" y="331" text-anchor="middle" fill="#ffffff" font-size="12">全部</text>
  <rect x="448" y="312" width="72" height="30" rx="15" fill="#ffffff" stroke="#d4ecdd"/>
  <text x="484" y="331" text-anchor="middle" fill="#587567" font-size="12">待办</text>
  <rect x="528" y="312" width="72" height="30" rx="15" fill="#ffffff" stroke="#d4ecdd"/>
  <text x="564" y="331" text-anchor="middle" fill="#587567" font-size="12">已完成</text>

  <!-- task card 1 (done) -->
  <g filter="url(#soft)">
    <rect x="380" y="360" width="740" height="70" rx="14" fill="#ffffff"/>
  </g>
  <circle cx="410" cy="395" r="12" fill="#16a86b"/>
  <path d="M404 395 l4 4 l8 -8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <text x="438" y="390" fill="#9db3a7" font-size="15" text-decoration="line-through">整理昨天的阅读笔记</text>
  <rect x="438" y="400" width="66" height="20" rx="10" fill="#eef6f1"/>
  <text x="471" y="414" text-anchor="middle" fill="#759083" font-size="11">08:00</text>

  <!-- task card 2 (todo, expanded) -->
  <g filter="url(#soft)">
    <rect x="380" y="440" width="740" height="128" rx="14" fill="#ffffff" stroke="#dcf8e8" stroke-width="1.5"/>
  </g>
  <circle cx="410" cy="472" r="12" fill="none" stroke="#c2d8cc" stroke-width="2"/>
  <text x="438" y="468" fill="#163a29" font-size="15" font-weight="600">完成 TypeScript 课程第 5 章</text>
  <rect x="438" y="478" width="66" height="20" rx="10" fill="#dcf8e8"/>
  <text x="471" y="492" text-anchor="middle" fill="#087849" font-size="11">08:00-10:00</text>
  <rect x="512" y="478" width="52" height="20" rx="10" fill="#fff0df"/>
  <text x="538" y="492" text-anchor="middle" fill="#ff6b3d" font-size="11">重要</text>

  <line x1="410" y1="516" x2="1096" y2="516" stroke="#eef6f1" stroke-width="1.5"/>
  <circle cx="418" cy="536" r="2.5" fill="#16a86b"/>
  <text x="430" y="540" fill="#587567" font-size="12.5">先看第 5 章视频前半段</text>
  <circle cx="418" cy="556" r="2.5" fill="#16a86b"/>
  <text x="430" y="560" fill="#587567" font-size="12.5">完成课后练习 1-3 题，把不懂的 API 记到笔记里</text>

  <!-- ===== Reader overlay peeking (right) ===== -->
  <g filter="url(#card)">
    <rect x="past" width="0" height="0"/>
  </g>
</svg>
